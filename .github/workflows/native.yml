name: Native desktop

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release installer
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Exercise the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 3840x2160x24' dbus-run-session -- python3 tools/smoke_current.py --binary src-tauri/target/release/branchline
      - name: Check diff search and saved settings
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- python3 tools/check_review_controls.py --binary src-tauri/target/release/branchline
      - uses: actions/upload-artifact@v4
        with:
          name: branchline-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
