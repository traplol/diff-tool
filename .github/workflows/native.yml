name: Native desktop

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  git-workers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            executable: branchline-git-worker
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            executable: branchline-git-worker.exe
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: src-tauri/target/git-worker
      RUSTFLAGS: -C target-feature=+crt-static
      LIBZ_SYS_STATIC: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install static Linux worker toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake
      - run: cargo test --locked --manifest-path src-tauri/git-worker/Cargo.toml --target ${{ matrix.target }}
      - run: cargo build --locked --release --manifest-path src-tauri/git-worker/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: git-worker-${{ matrix.platform }}
          path: src-tauri/target/git-worker/${{ matrix.target }}/release/${{ matrix.executable }}
          if-no-files-found: error

  build:
    needs: git-workers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: deb
            worker: windows
          - os: windows-latest
            bundle: nsis
            worker: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: git-worker-${{ matrix.worker }}
          path: build/embedded-worker
      - name: Select embedded storage-side worker
        shell: python
        run: |
          import os
          from pathlib import Path
          executable = "branchline-git-worker" + (".exe" if os.name != "nt" else "")
          worker = Path("build/embedded-worker", executable).resolve(strict=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BRANCHLINE_GIT_WORKER_PATH={worker}\n")
      - name: Use the static Windows runtime
        if: runner.os == 'Windows'
        shell: python
        run: |
          import os
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("RUSTFLAGS=-C target-feature=+crt-static\n")
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb xauth
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build release installer
        run: npm run tauri -- build --bundles ${{ matrix.bundle }}
      - name: Exercise the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 3840x2160x24' dbus-run-session -- python3 tools/smoke_native.py --binary src-tauri/target/release/branchline
      - name: Check diff search and saved settings
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 tools/check_review_controls.py --binary src-tauri/target/release/branchline
      - name: Check diff context and scoped search
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 tools/check_review_context.py --binary src-tauri/target/release/branchline
      - name: Check review at the minimum window size
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 tools/check_review_compact.py --binary src-tauri/target/release/branchline
      - name: Check review draft recovery
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 tools/check_review_drafts.py --binary src-tauri/target/release/branchline
      - name: Check search result destinations
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 tools/check_review_sources.py --binary src-tauri/target/release/branchline
      - uses: actions/upload-artifact@v4
        with:
          name: branchline-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
