[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "branchline-review"
version = "0.1.0"
description = "A native desktop workspace for local Git branch and stack reviews"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
branchline = "branchline.__main__:main"

[tool.setuptools]
packages = ["branchline"]
