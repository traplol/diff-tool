[package]
name = "branchline-git-worker"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Branchline storage-side Git worker without GUI dependencies"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
default = ["storage-worker"]
storage-worker = []
