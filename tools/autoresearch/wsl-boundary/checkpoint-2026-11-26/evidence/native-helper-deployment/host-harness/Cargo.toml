[package]
name = "branchline-native-helper-host-check"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Console"] }

[features]
storage-worker = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(branchline_git_worker)"] }
